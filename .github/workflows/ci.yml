name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dq
          POSTGRES_PASSWORD: dq
          POSTGRES_DB: dq_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dq -d dq_gate"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://dq:dq@localhost:5432/dq_gate
      TEST_DATABASE_URL: postgresql+psycopg://dq:dq@localhost:5432/dq_gate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
          pip check
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -v --cov

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the API with its database
        run: docker compose --profile app up -d --build --wait
      - name: Smoke test
        run: scripts/smoke_api.sh http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs
      - name: Stop
        if: always()
        run: docker compose --profile app down -v
