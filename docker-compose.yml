services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
      POSTGRES_DB: dq_gate
    ports:
      # 5433 on the host so it does not collide with a local Postgres on 5432.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq -d dq_gate"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - dq_gate_pg:/var/lib/postgresql/data

  # Started only with `docker compose --profile app up`, so `docker compose up` stays
  # database-only for running the app and tests from a local venv.
  api:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://dq:dq@db:5432/dq_gate
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dq_gate_pg:
